name: Elite AI Engine Code Verification (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: ?? Clone Repository Source
      uses: actions/checkout@v4

    - name: ?? Initialize Production Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: ?? Install Architecture Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: ? Execute Asynchronous Architecture Tests
      run: |
        python -m pytest tests/ -v
